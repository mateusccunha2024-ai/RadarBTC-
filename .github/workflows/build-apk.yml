name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadarBTC-v0.1.${{ github.run_number }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radar BTC (build ${{ github.run_number }})
          body: APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
          files: RadarBTC-v0.1.${{ github.run_number }}.apk
          make_latest: true

      - name: Reportar erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} falhou no commit ${{ github.sha }}."
            echo
            echo '```'
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -n 120 || true
            echo '---- fim do log ----'
            tail -n 60 build.log || true
            echo '```'
          } > report.md
          gh issue create --title "Falha no build ${{ github.run_number }}" --body-file report.md
