name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/radarbtc.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/radarbtc.p12" >> "$GITHUB_ENV"

      - name: Compilar APK assinado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk RadarBTC-v0.1.${{ github.run_number }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radar BTC Android (build ${{ github.run_number }})
          body: APK assinado (atualiza o app instalado). Commit ${{ github.sha }}.
          files: RadarBTC-v0.1.${{ github.run_number }}.apk
          make_latest: true

      - name: Reportar erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} falhou no commit ${{ github.sha }}."
            echo
            echo '```'
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -n 120 || true
            echo '---- fim do log ----'
            tail -n 60 build.log || true
            echo '```'
          } > report.md
          gh issue create --title "Falha no build ${{ github.run_number }}" --body-file report.md
