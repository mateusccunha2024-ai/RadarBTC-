name: IA compatível (PC sem AVX2)

# Compila a biblioteca da IA local (java-llama.cpp 4.2.0 = llama.cpp b4916) para processadores sem AVX2:
#   avx/jllama.dll  -> só AVX (ex.: Intel Core 2ª/3ª geração)
#   sse/jllama.dll  -> só SSE4.2 (processadores mais antigos)
# Guarda uma vez numa release fixa; os builds do Windows baixam de lá e colocam no instalador.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: llama-compat-b4916-v2
  ZIP: llama-compat-windows-x64.zip

jobs:
  compat:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Já existe?
        id: have
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ZIP"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Biblioteca compatível já publicada."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar java-llama.cpp 4.2.0
        if: steps.have.outputs.skip != 'true'
        shell: bash
        run: git clone -q --depth 1 --branch v4.2.0 https://github.com/kherud/java-llama.cpp.git jllama

      - name: Compilar (AVX e SSE, sem AVX2/FMA/F16C)
        if: steps.have.outputs.skip != 'true'
        shell: bash
        working-directory: jllama
        run: |
          set -e
          base='-A x64 -DOS_NAME=Windows -DOS_ARCH=x86_64 -DGGML_NATIVE=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_AVX512=OFF -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DLLAMA_CURL=OFF'
          for v in avx sse; do
            if [ "$v" = avx ]; then extra="-DGGML_AVX=ON"; else extra="-DGGML_AVX=OFF"; fi
            rm -rf src/main/resources/de/kherud/llama/Windows
            eval cmake -B "build-$v" $base $extra 2>&1 | tee "cfg-$v.log"
            # Garantia: nada de AVX2/BMI2/FMA/F16C (o i7 de 2ª/3ª geração não tem). Se aparecer, o build falha.
            grep -i "Adding CPU backend variant" "cfg-$v.log"
            if grep -i "Adding CPU backend variant" "cfg-$v.log" | grep -Eiq "AVX2|BMI2|FMA|F16C"; then echo "ERRO: instrução proibida na versão $v"; exit 1; fi
            cmake --build "build-$v" --config Release -j 4
            mkdir -p "../out/$v"
            cp src/main/resources/de/kherud/llama/Windows/x86_64/*.dll "../out/$v/"
            ls -la "../out/$v"
          done
          cd .. && 7z a "$ZIP" ./out/* > /dev/null && ls -la "$ZIP"

      - name: Publicar
        if: steps.have.outputs.skip != 'true'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" --title "IA compatível (PC sem AVX2)" --latest=false \
              --notes "Biblioteca da IA local (llama.cpp b4916 / java-llama.cpp 4.2.0) compilada sem AVX2, usada automaticamente pelo Radar BTC em processadores antigos."
          gh release upload "$TAG" "$ZIP" -R "${{ github.repository }}" --clobber
