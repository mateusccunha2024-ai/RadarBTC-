name: Verificar V8

on:
  push:
    branches: [v8]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Baixar a IA leve (teste do processo separado da IA)
        continue-on-error: true
        run: curl -sSfL --retry 3 -o "$RUNNER_TEMP/qwen-0.5b.gguf" "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

      - name: Compilar Windows e Android (APK) + testes unitários e de carga
        env: { JARVIS_TEST_MODEL: "${{ runner.temp }}/qwen-0.5b.gguf" }
        run: |
          set -o pipefail
          gradle :desktop:test :app:assembleDebug --no-daemon --continue 2>&1 | tee build.log

      - name: Guardar resultado dos testes unitários
        if: always()
        run: |
          for f in desktop/build/test-results/test/*.xml; do
            [ -f "$f" ] && grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done > units.txt || true
          grep -h -A3 "<failure" desktop/build/test-results/test/*.xml | head -n 60 >> units.txt || true

      - name: Teste ao vivo (dados reais, 45 s)
        if: success()
        continue-on-error: true
        env: { LIVE: "1" }
        run: gradle :desktop:test --tests '*LiveSmokeTest*' --rerun-tasks --no-daemon -q 2>&1 | tail -n 5 || true

      - name: Capturas de tela (dados reais)
        if: success()
        continue-on-error: true
        env: { SHOTS: "1" }
        run: |
          # Fontes de chinês, japonês e coreano para as capturas dos idiomas asiáticos (Windows e Android já têm).
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null 2>&1 || true
          gradle :desktop:test --tests '*ScreenshotTest*' --rerun-tasks --no-daemon -q 2>&1 | tail -n 20 || true
          cd desktop/build/screens
          git init -q && git checkout -q -b screens
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "capturas ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens

      - name: Relatório
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Commit ${{ github.sha }} — resultado: ${{ job.status }}"
            echo
            echo "### Compilação"
            echo '```'
            grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong" -A2 build.log | head -n 150 || true
            echo '```'
            echo "### Testes unitários"
            echo '```'
            cat units.txt 2>/dev/null
            echo '```'
            cat desktop/build/load-report.md 2>/dev/null
            echo
            cat desktop/build/live-report.md 2>/dev/null || echo "(teste ao vivo não gerou relatório)"
          } > report.md
          gh issue create --title "Verificação V8 #${{ github.run_number }}" --body-file report.md

  # Jarvis no Windows de verdade: o RadarBTC.exe abre a IA num processo separado, ela responde, cai e o app continua.
  compat:
    uses: ./.github/workflows/llama-compat.yml

  windows-ia:
    needs: compat
    runs-on: windows-latest
    timeout-minutes: 70
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: IA compatível (PC sem AVX2)
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/scripts/fetch-llama-compat.sh
      - name: Gerar o app (como no instalador)
        shell: bash
        run: gradle :desktop:createDistributable --no-daemon -q
      - name: Baixar a IA leve
        shell: bash
        run: curl -sSfL --retry 3 -o "$RUNNER_TEMP/qwen-0.5b.gguf" "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
      - name: Testar a IA em processo separado pelo RadarBTC.exe
        shell: pwsh
        run: |
          $exe = "desktop/build/compose/binaries/main/app/RadarBTC/RadarBTC.exe"
          $out = "$env:RUNNER_TEMP\ia-test.txt"
          $p = Start-Process -FilePath $exe -ArgumentList @("--jarvis-llm-test", "$env:RUNNER_TEMP\qwen-0.5b.gguf", $out) -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Output "TEMPO ESGOTADO" }
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\radarbtc-ia-test\ia-processo.log" -Tail 15 -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $out -Pattern "fim ok" -Quiet)) { exit 1 }
          # Mesma IA com as bibliotecas compatíveis (PC sem AVX2): precisa carregar e responder também
          foreach ($v in @("avx", "sse")) {
            $o = "$env:RUNNER_TEMP\ia-test-$v.txt"
            $q = Start-Process -FilePath $exe -ArgumentList @("--jarvis-llm-test", "$env:RUNNER_TEMP\qwen-0.5b.gguf", $o, $v) -PassThru
            if (-not $q.WaitForExit(900000)) { $q.Kill(); Write-Output "TEMPO ESGOTADO ($v)" }
            Write-Output "---- compatível: $v"
            Get-Content $o -ErrorAction SilentlyContinue
            Select-String -Path "$env:TEMP\radarbtc-ia-test\ia-processo.log" -Pattern "system_info" -ErrorAction SilentlyContinue
            if (-not (Select-String -Path $o -Pattern "fim ok" -Quiet)) { exit 1 }
          }

  # Jarvis num emulador Android: abrir o painel e usar a IA, a voz e o microfone de verdade.
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compilar o APK de teste
        run: gradle :app:assembleDebug --no-daemon -q
      - name: Ligar a aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador Android (API 30, 4 GB)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
      - name: Guardar o resultado (ramo android-smoke)
        if: always()
        run: |
          mkdir -p smoke && cd smoke
          git init -q && git checkout -q -b android-smoke
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "android ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-smoke
